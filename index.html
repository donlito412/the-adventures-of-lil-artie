<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Adventures of Lil Artie — a browser-based 3D open-world adventure game." />
    <title>The Adventures of Lil Artie</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #e8c97a;
      }

      #loading-screen h1 {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 30px rgba(232, 201, 122, 0.5);
      }

      #loading-screen p {
        font-size: 1rem;
        color: #888;
        margin-bottom: 2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      #loading-bar-container {
        width: 300px;
        height: 4px;
        background: #222;
        border-radius: 2px;
        overflow: hidden;
      }

      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e8c97a, #f5a623);
        border-radius: 2px;
        transition: width 0.3s ease;
      }

      #loading-status {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #555;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>Lil Artie</h1>
      <p>The Adventures Begin</p>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
      <div id="loading-status">Initializing engine...</div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
